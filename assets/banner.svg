<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- sky-400 -->
      <stop offset="50%" stop-color="#a855f7" /> <!-- purple-500 -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- pink-500 -->
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" rx="16" fill="url(#bg-grad)" />

  <!-- Grid / Abstract Tech Patterns -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="400" y1="0" x2="400" y2="250" />
    <line x1="500" y1="0" x2="500" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
    <line x1="700" y1="0" x2="700" y2="250" />
  </g>

  <!-- Abstract connection lines -->
  <path d="M 150 50 Q 250 180 400 125 T 650 200" fill="none" stroke="url(#text-grad)" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 100 200 Q 300 80 500 170 T 700 80" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Nodes (Function Calling representation) -->
  <!-- Central LLM Node -->
  <circle cx="400" cy="125" r="45" fill="#1e1e2e" stroke="url(#text-grad)" stroke-width="3" filter="url(#glow)" />
  <text x="400" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">LLM</text>

  <!-- Tool Nodes -->
  <g filter="url(#glow)">
    <!-- Node 1: API -->
    <circle cx="200" cy="80" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M 194 76 H 206 V 84 H 194 Z M 197 76 V 73 H 203 V 76" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="222" y1="88" x2="355" y2="115" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Node 2: Database -->
    <circle cx="600" cy="90" r="22" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <ellipse cx="600" cy="84" rx="8" ry="3" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <path d="M 592 84 V 92 A 8 3 0 0 0 608 92 V 84" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <path d="M 592 92 V 96 A 8 3 0 0 0 608 96 V 92" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <line x1="578" y1="98" x2="445" y2="118" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Node 3: Custom Code / Action -->
    <circle cx="300" cy="190" r="20" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="300" y="195" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#a855f7" text-anchor="middle">&lt;/&gt;</text>
    <line x1="318" y1="180" x2="360" y2="150" stroke="#a855f7" stroke-width="1.5" />

    <!-- Node 4: Web Search -->
    <circle cx="500" cy="180" r="20" fill="#0f172a" stroke="#eab308" stroke-width="2" />
    <circle cx="497" cy="177" r="4" fill="none" stroke="#eab308" stroke-width="1.5" />
    <line x1="500" y1="180" x2="505" y2="185" stroke="#eab308" stroke-width="2" />
    <line x1="483" y1="170" x2="425" y2="145" stroke="#eab308" stroke-width="1.5" />
  </g>

  <!-- Content Text -->
  <text x="400" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#text-grad)" text-anchor="middle" letter-spacing="2">AWESOME FUNCTION CALLING</text>
  <text x="400" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">The Definitive Guide to LLM Tool Execution, Schema Strictness, and Agent Architectures</text>
</svg>
